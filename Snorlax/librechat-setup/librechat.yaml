version: 1.3.13
cache: true

# Enable the OpenAI-compatible "remote agents" API so the SonyLIV dashboard can
# call LibreChat headlessly at POST /api/agents/v1/chat/completions with an agent
# API key. The first registered user is an admin and gets these permissions;
# create an agent (wired to the Ollama endpoint below) and an API key from the
# UI, then point the dashboard at them. See ./README.md → "Remote agents".
interface:
  remoteAgents:
    use: true
    create: true
    share: true
    public: false

endpoints:
  custom:
    - name: "Ollama"
      apiKey: "ollama"
      baseURL: "http://ollama:11434/v1/"
      models:
        default:
          - "llama3.2:3b"
      fetch: true
      titleConvo: true
      titleModel: "current_model"
      summarize: false
      summaryModel: "current_model"
      modelDisplayLabel: "Ollama"
